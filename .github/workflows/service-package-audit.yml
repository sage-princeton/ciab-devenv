name: Service package audit
on:
  schedule:
    - cron: '39 10 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  packages:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install declared Trivy
        run: |
          docker build --output "type=local,dest=$RUNNER_TEMP/trivy" .github/tools/trivy
          echo "$RUNNER_TEMP/trivy" >> "$GITHUB_PATH"
      - run: python3 -m pip install -r .github/requirements-audit.txt
      - name: Export service SPDX and vulnerability reports
        run: |
          mkdir -p "$RUNNER_TEMP/packages"
          python3 .github/scripts/service-images.py > "$RUNNER_TEMP/packages/images.txt"
          index=0
          while IFS= read -r image; do
            index=$((index + 1))
            trivy image --format spdx-json --output "$RUNNER_TEMP/packages/$index.spdx.json" "$image"
            trivy image --scanners vuln --format json --output "$RUNNER_TEMP/packages/$index-vulnerabilities.json" "$image"
            trivy image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed "$image"
          done < "$RUNNER_TEMP/packages/images.txt"
      - name: Preserve package evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: service-package-audit
          path: ${{ runner.temp }}/packages/
          retention-days: 30
          if-no-files-found: error
